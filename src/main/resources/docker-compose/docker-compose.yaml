services:

  grafana:
    container_name: grafana
    image: grafana/grafana:9.3.8
    restart: always
    ports:
      - "3000:3000"
    volumes:
     - ./grafana:/etc/grafana/provisioning/datasources
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    networks:
      - prometheus-network

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v2.44.0
    user: root
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus-config.yaml
      - --log.level=debug
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prometheus-network

  postgres:
    image: postgres:18
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./../pgdata:/var/lib/postgresql/data/pgdata
      - ./../sql:/docker-entrypoint-initdb.d/
    deploy:
      resources:
        limits:
          cpus: '4.50'
          memory: 2512M
        reservations:
          cpus: '4.25'
          memory: 2256M
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=1024MB
               -c effective_cache_size=1768MB
               -c maintenance_work_mem=164MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=160MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d test" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - prometheus-network

  prometheus_pg:
    container_name: prometheus_pg
    image: quay.io/prometheuscommunity/postgres-exporter
#    command:
#      - --config.file=/etc/postgres_exporter/postgres_exporter.yml
    environment:
      DATA_SOURCE_URI: postgresql://postgres:postgres@localhost:5432/?sslmode=disable
    volumes:
      - ./postgres_exporter:/etc/postgres_exporter
    ports:
      - "9187:9187"
    network_mode: host
#    networks:
#      - prometheus-network
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

volumes:
  pgdata:
    driver: local

networks:
 prometheus-network:
